name: CI

on:
  # Feature branches are checked by the PR, main after the merge. Doc-only
  # changes run too (gitleaks checks Markdown as well).
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.deps }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # lowest: the oldest Kirby 5 and the oldest dependencies allowed by composer.json.
        # locked: the versions in composer.lock, what a site gets from the committed lock.
        # highest: the newest versions allowed by composer.json, the lock is ignored.
        deps: [lowest, locked, highest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, exif, curl, dom, simplexml, libxml, iconv, filter, ctype, openssl
          coverage: none

      - name: Install dependencies, lowest versions
        if: matrix.deps == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Install dependencies, locked versions
        if: matrix.deps == 'locked'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install dependencies, highest versions
        if: matrix.deps == 'highest'
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Tests (Kirby as fixture)
        run: vendor/bin/phpunit

  script:
    name: Panel script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Behaviour (fake Panel, no dependencies)
        run: |
          set -eu
          found=0
          for f in tests/*.test.mjs; do [ -e "$f" ] && found=1; done
          if [ "$found" = 1 ]; then node --test tests/*.test.mjs; else echo "no JS tests yet"; fi

      - name: Syntax check, no storage, no foreign host, no eval
        run: |
          node --check index.js
          if grep -nE 'localStorage|sessionStorage|document\.cookie|indexedDB' index.js; then
            echo "::error::index.js must not store anything in the browser"; exit 1
          fi
          if grep -nPi 'https?://(?!github\.com/sayamaapps)' index.js; then
            echo "::error::index.js must not name any address except the project page"; exit 1
          fi
          if grep -nE '\beval\(|new Function\(' index.js; then
            echo "::error::index.js must not evaluate strings"; exit 1
          fi

  analysis:
    name: Analysis, PHP 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # PHPMD 2.15 prints deprecation notices on PHP 8.5, so the analysis runs on 8.4.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer validate
        run: composer validate --strict --no-check-version --no-check-all

      - name: Composer normalize
        run: composer normalize:check

      - name: Undeclared dependencies
        run: composer analyze:require-checker

      - name: Unused dependencies
        run: composer analyze:unused

      # phpcpd 6.0.3 requires dependencies that conflict with PHPUnit 11, so it is
      # installed globally, like php-cs in the style job.
      - name: Install phpcpd
        run: |
          composer global require --no-interaction sebastian/phpcpd:6.0.3
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Duplicated code
        run: phpcpd --fuzzy --exclude tests --exclude vendor .

      - name: Platform requirements
        run: composer check-platform-reqs

      - name: Psalm
        run: composer analyze:psalm

      - name: PHP Mess Detector
        run: composer analyze:phpmd

  style:
    name: Code style, PHP 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # getkirby/php-cs needs PHP 8.3 or newer, so it is installed globally and
      # not as a dependency: the package itself supports PHP 8.2.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install php-cs
        run: |
          composer global require --no-interaction getkirby/php-cs:0.2.1
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Check code style
        run: kirby-cs fix --dry-run --diff

  secrets:
    name: No secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks checks the whole history, not only the last state: a
          # secret once committed stays there even after it is deleted again.
          fetch-depth: 0
      - name: gitleaks
        run: |
          if command -v gitleaks >/dev/null; then gitleaks git . --no-banner --redact
          else docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 git /repo --no-banner --redact; fi

  # Kirby 6 is a pre-release. This job runs the same tests against it so the
  # next major shows up early. Failing tests show up as a warning and never
  # fail the workflow, so main keeps its green check. Kirby 6 is required
  # only inside the job: composer.json and the tags stay on Kirby 5.
  kirby-6:
    name: Kirby 6 pre-release, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Kirby 6 supports PHP 8.3 to 8.5.
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, exif, curl, dom, simplexml, libxml, iconv, filter, ctype, openssl
          coverage: none

      # platform.php resolves the dependencies for PHP 8.2, which Kirby 6 no
      # longer supports. ^6.0@beta installs the newest Kirby 6 release: a beta
      # or release candidate until the stable version is out.
      - name: Install dev dependencies with Kirby 6
        run: |
          composer config --unset platform.php
          composer require --dev 'getkirby/cms:^6.0@beta' --with-all-dependencies --no-interaction --no-progress --prefer-dist

      - name: Tests
        run: vendor/bin/phpunit || echo "::warning title=Kirby 6::Tests fail against the Kirby 6 pre-release, see the log"
