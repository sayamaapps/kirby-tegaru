name: CI

on:
  # Feature branches are checked by the PR, main after the merge. Doc-only
  # changes run too (gitleaks checks Markdown as well).
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, exif, curl, dom, simplexml, libxml, iconv, filter, ctype, openssl
          coverage: none

      - name: Install dev dependencies (Kirby as fixture)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests
        run: sh tests/run.sh

  script:
    name: index.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Behaviour (fake Panel, no dependencies)
        run: |
          set -eu
          found=0
          for f in tests/*.test.mjs; do [ -e "$f" ] && found=1; done
          if [ "$found" = 1 ]; then node --test tests/*.test.mjs; else echo "no JS tests yet"; fi

      - name: Syntax check, no storage, no foreign host, no eval
        run: |
          node --check index.js
          if grep -nE 'localStorage|sessionStorage|document\.cookie|indexedDB' index.js; then
            echo "::error::index.js must not store anything in the browser"; exit 1
          fi
          if grep -nPi 'https?://(?!github\.com/sayamaapps)' index.js; then
            echo "::error::index.js must not name any address except the project page"; exit 1
          fi
          if grep -nE '\beval\(|new Function\(' index.js; then
            echo "::error::index.js must not evaluate strings"; exit 1
          fi

  secrets:
    name: No secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks checks the whole history, not only the last state: a
          # secret once committed stays there even after it is deleted again.
          fetch-depth: 0
      - name: gitleaks
        run: |
          if command -v gitleaks >/dev/null; then gitleaks git . --no-banner --redact
          else docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 git /repo --no-banner --redact; fi
